name: Notion sync

# Notion "All Courses" is the source of truth. This workflow:
# - adds a course to Notion when Phoebe opens an "Add a course" issue (the site's paste box opens one),
# - syncs Notion into entries/ every day and on demand,
# - rebuilds the site and commits it, which republishes GitHub Pages.
# It needs one repository secret: NOTION_TOKEN (see README, "Notion sync").

on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 1 * * *"   # daily, 09:17 Singapore time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    # Issues only count when Phoebe opens them with the add-course label. Anyone else's issue is ignored.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'phoebefu6' &&
       contains(github.event.issue.labels.*.name, 'add-course'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add the course to Notion
        if: github.event_name == 'issues'
        id: add
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/add_course.py --issue-body-env ISSUE_BODY --reply "$RUNNER_TEMP/reply.md"

      - name: Sync Notion into entries
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_notion.py

      - name: Build the site
        run: python3 build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A entries data.json index.html network.html domains.json
          if git diff --cached --quiet; then
            echo "No changes from Notion."
          else
            git commit -m "Sync courses from Notion"
            git push
          fi

      - name: Reply on the issue and close it
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reply.md"
          else
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The sync failed before the course was added. See the Actions log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
